server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # The reverse proxy in front already logs nothing about visitors: same here.
    access_log off;

    # File names carry a content hash: they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
