name: Runaway checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runaway
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: runaway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runaway -d runaway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Isolated SQLite tests
        run: python -m pytest
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://runaway:test_only@localhost:5432/runaway_test
        run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (bloquant)
        run: npm run lint
      - run: npm run build
      - name: Audit des dépendances (avertissement seulement)
        # Never fails the job: a finding becomes a warning annotation to read.
        run: npm audit --audit-level=low || echo "::warning title=npm audit::Des vulnérabilités sont signalées, voir le détail de cette étape."
