# Production stack, separate from compose.yaml (local PostgreSQL only).
# Run through deploy/deploy.sh, or: docker compose --env-file .env.prod -f compose.prod.yaml <command>
# Every value comes from .env.prod, see deploy/env.prod.example. API and database publish no port.
name: runaway

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  proxy:
    <<: *hardening
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # The only address the API trusts for X-Forwarded-For, see the api command.
        ipv4_address: 172.30.0.10

  web:
    <<: *hardening
    image: runaway-web:${RUNAWAY_VERSION:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - edge

  api:
    <<: *hardening
    image: runaway-api:${RUNAWAY_VERSION:-local}
    build:
      context: backend
    depends_on:
      db:
        condition: service_healthy
    # Without these two flags every visitor would have the address of the proxy and share one
    # creation quota. Restricted to the proxy: anybody else sending X-Forwarded-For is ignored.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --no-server-header
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.0.10
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}
      LLM_PROVIDER: fake
      # One domain for the site and the API: same origin, no CORS needed.
      CORS_ORIGINS: ''
      RATE_LIMIT_CREATIONS_PER_IP: ${RATE_LIMIT_CREATIONS_PER_IP:-10}
      RATE_LIMIT_CREATIONS_GLOBAL: ${RATE_LIMIT_CREATIONS_GLOBAL:-200}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-3600}
      RETENTION_MONTHS: ${RETENTION_MONTHS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - edge
      - data

  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # No route to the outside: only the API reaches the database.
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
